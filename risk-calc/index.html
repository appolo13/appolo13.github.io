<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KTR 리스크">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>KTR 리스크 계산기</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --txt:#e6edf3; --muted:#8b98a5; --gold:#f0b429; --green:#3fb950; --red:#f85149;
    --blue:#4493f8; --input:#0d1117;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-variant-numeric:tabular-nums}
  body{padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto}
  h1{font-size:17px; margin:4px 0 14px; display:flex; align-items:center; gap:8px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .card h2{font-size:12px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; margin:0 0 10px}
  .row{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  label{flex:0 0 78px; font-size:14px; color:var(--muted)}
  input,select{flex:1; background:var(--input); border:1px solid var(--line); color:var(--txt);
    font-size:17px; padding:11px 12px; border-radius:10px; width:100%; font-variant-numeric:tabular-nums;
    -webkit-appearance:none; appearance:none}
  input:focus,select:focus{outline:none; border-color:var(--blue)}
  input[inputmode]{text-align:right; letter-spacing:.02em}
  .price-btn{flex:0 0 auto; background:var(--panel2); border:1px solid var(--line); color:var(--gold);
    font-size:15px; padding:11px 13px; border-radius:10px; font-weight:600}
  .price-btn:active{background:#232c38}
  .price-note{font-size:11px; color:var(--muted); margin:-4px 0 0 88px}
  /* 판정 */
  .verdict{border-radius:12px; padding:14px; font-size:15px; line-height:1.5}
  .verdict.ok{background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.35)}
  .verdict.no{background:rgba(248,81,73,.10); border:1px solid rgba(248,81,73,.30)}
  .verdict .big{font-size:16px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px}
  .verdict.ok .big{color:var(--green)} .verdict.no .big{color:var(--red)}
  .verdict .lots{color:var(--txt); font-size:14px}
  .verdict .tuning{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--muted); font-size:13px}
  .verdict .tuning b{color:var(--gold); font-weight:600}
  .verdict .tuning div{margin-top:3px}
  /* 표 */
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{padding:9px 6px; text-align:right}
  th:first-child,td:first-child{text-align:left; color:var(--muted)}
  thead th{font-size:12px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line)}
  tbody tr+tr td{border-top:1px solid rgba(42,50,61,.55)}
  .pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--muted)}
  .price-lbl{font-size:11px; color:var(--muted); display:block; font-weight:400}
  /* 체크 */
  .checks{display:flex; flex-direction:column; gap:8px}
  .chk{display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; cursor:pointer; user-select:none}
  .chk.on{border-color:var(--gold); background:rgba(240,180,41,.08)}
  .chk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--bg)}
  .chk.on .box{background:var(--gold); border-color:var(--gold)}
  .chk .n{font-weight:600; flex:0 0 46px}
  .chk .p{color:var(--muted); font-size:13px; flex:1}
  .chk .l{color:var(--gold); font-size:13px}
  .status{display:flex; gap:8px}
  .stat{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 8px; text-align:center}
  .stat .k{font-size:11px; color:var(--muted); margin-bottom:4px}
  .stat .v{font-size:17px; font-weight:700}
  /* 스텝퍼 */
  .stepper{flex:1; display:flex; align-items:stretch; background:var(--input); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .stepper button{flex:0 0 46px; background:var(--panel2); border:none; color:var(--txt); font-size:22px; font-weight:600; line-height:1}
  .stepper button:active{background:var(--gold); color:var(--bg)}
  .stepper .val{flex:1; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; padding:11px 4px}
  .riskUsd{flex:0 0 auto; min-width:58px; text-align:right; color:var(--gold); font-size:15px; font-weight:600}
  .hide{display:none!important}
  .foot{text-align:center; color:var(--muted); font-size:11px; margin-top:8px; line-height:1.6}
  @media (prefers-color-scheme:light){
    :root{--bg:#f4f6f8;--panel:#fff;--panel2:#f0f3f6;--line:#dce1e7;--txt:#1a2028;--muted:#67727e;--input:#fff}
  }
</style>
</head>
<body>
<h1><span class="dot"></span> KTR 리스크 계산기 <span style="font-size:12px;color:var(--muted);font-weight:400">1·3·5 균등</span></h1>

<div class="card">
  <h2>입력</h2>
  <div class="row">
    <label>종목</label>
    <select id="symbol">
      <option value="XAUUSD">XAUUSD (금)</option>
      <option value="XAGUSD">XAGUSD (은)</option>
      <option value="US100">US100 (나스닥)</option>
      <option value="US30">US30 (다우)</option>
    </select>
  </div>
  <div class="row">
    <label>진입가</label>
    <input id="entry" inputmode="decimal" placeholder="4500">
    <button class="price-btn" id="fetchBtn">🔄 현재가</button>
  </div>
  <div class="price-note" id="priceNote"></div>
  <div class="row"><label>손절가</label><input id="sl" inputmode="decimal" placeholder="4450"></div>
  <div class="row">
    <label>증거금</label>
    <div class="stepper">
      <button data-k="margin" data-d="-1">−</button>
      <div class="val" id="marginVal">$100</div>
      <button data-k="margin" data-d="1">+</button>
    </div>
    <div class="riskUsd" aria-hidden="true"></div>
  </div>
  <div class="row">
    <label>리스크</label>
    <div class="stepper">
      <button data-k="pct" data-d="-1">−</button>
      <div class="val" id="pctVal">10%</div>
      <button data-k="pct" data-d="1">+</button>
    </div>
    <div class="riskUsd" id="riskUsd">$10</div>
  </div>
  <div class="row"><label>KTR pt</label><input id="ktr" inputmode="decimal" placeholder="10"></div>
</div>

<div class="card">
  <h2>판정</h2>
  <div id="verdict"></div>
</div>

<div class="card" id="scenarioCard">
  <h2>시나리오 — 도달가 × 진입차수</h2>
  <table id="scenarioTable"></table>
</div>

<div class="card" id="checkCard">
  <h2>진행 체크 (체결 시 탭)</h2>
  <div class="checks" id="checks"></div>
  <div class="status" id="status" style="margin-top:12px"></div>
</div>

<div class="foot">
  현재가는 <b>현물 시세</b> (브로커 CFD와 몇 $ 차이). 진입가는 MT5에서 확정.<br>
  계산은 오프라인 동작. 입력값 자동 저장.
</div>

<script>
const SYMBOLS = {
  XAUUSD:{pt:100, live:'XAU', dp:2},
  XAGUSD:{pt:5000, live:'XAG', dp:3},
  US100:{pt:1, live:null, dp:1},
  US30:{pt:1, live:null, dp:1},
};
const $ = id => document.getElementById(id);
const round2 = x => Math.round(x*100)/100;
const fmtUsd = v => (v>=0?'+$':'-$') + Math.abs(Math.round(v)).toLocaleString();
const cls = v => v>0?'pos':(v<0?'neg':'zero');

let checked = [true,false,false]; // 1,3,5차
let margin = 100;   // 증거금 $ (100 단위)
let pct = 10;       // 리스크 % (10 단위, 10~50)

const riskUsd = () => Math.round(margin * pct / 100);

function renderRisk(){
  $('marginVal').textContent = '$' + margin.toLocaleString();
  $('pctVal').textContent = pct + '%';
  $('riskUsd').textContent = '$' + riskUsd().toLocaleString();
}

function readInputs(){
  const sym = $('symbol').value;
  return {
    sym,
    pt: SYMBOLS[sym].pt,
    dp: SYMBOLS[sym].dp,
    entry: parseFloat($('entry').value),
    sl: parseFloat($('sl').value),
    risk: riskUsd(),
    ktr: parseFloat($('ktr').value),
  };
}

function tuning(entry, risk, ktr, pt, side, slPt){
  const se = side==='LONG'?-1:1, out=[];
  if(slPt > 4*ktr){
    const minLoss=(3*slPt-6*ktr)*0.01*pt;
    out.push(['리스크', `≥ $${Math.round(minLoss)}`]);
  }
  const maxSlPt=(risk/(0.01*pt)+6*ktr)/3, minSlPt=4*ktr+0.01;
  if(maxSlPt>minSlPt){
    out.push(['SL', `${(entry+se*maxSlPt).toFixed(2)} 이내 (≤ ${Math.round(maxSlPt)}pt)`]);
  }
  const ktrMax=slPt/4-0.01, ktrMin=(3*slPt-risk/(0.01*pt))/6;
  if(ktrMin<ktrMax && ktrMax>0){
    out.push(['KTR', `${Math.max(ktrMin,0.1).toFixed(1)} ~ ${ktrMax.toFixed(1)}pt`]);
  }
  return out;
}

function calc(){
  const i = readInputs();
  const bad = [i.entry,i.sl,i.risk,i.ktr].some(v=>!isFinite(v)||v<=0);
  if(bad){
    $('verdict').innerHTML = '<div class="verdict no"><div class="lots" style="color:var(--muted)">진입가 · 손절가 · 리스크 · KTR 을 모두 입력하세요.</div></div>';
    $('scenarioCard').classList.add('hide'); $('checkCard').classList.add('hide');
    return;
  }
  const side = i.sl < i.entry ? 'LONG' : 'SHORT';
  const slPt = Math.abs(i.sl - i.entry);
  const kCount = slPt/i.ktr;

  // 진입 불가 1: 5차 진입 불가
  if(slPt <= 4*i.ktr){
    renderNo(`SL까지 ${slPt.toFixed(0)}pt = ${kCount.toFixed(1)}K → 5차 진입 불가 (필요: > 4K = ${(4*i.ktr).toFixed(0)}pt)`,
             tuning(i.entry,i.risk,i.ktr,i.pt,side,slPt));
    return;
  }
  const baseLoss=(3*slPt-6*i.ktr)*0.01*i.pt;
  const scale=baseLoss>0?i.risk/baseLoss:1;
  const lot=Math.max(round2(0.01*scale),0.01);
  const loss=(3*slPt-6*i.ktr)*lot*i.pt;

  // 진입 불가 2: 리스크 초과
  if(loss > i.risk*1.05){
    renderNo(`최소 손실 $${Math.round(loss)} > 목표 $${Math.round(i.risk)} (0.01랏 균등으로도 초과)`,
             tuning(i.entry,i.risk,i.ktr,i.pt,side,slPt));
    return;
  }
  renderOk(i, side, slPt, kCount, lot, loss);
}

function renderNo(reason, tune){
  let h = `<div class="verdict no"><div class="big">❌ 진입 불가</div><div class="lots">${reason}</div>`;
  if(tune.length){
    h += '<div class="tuning">튜닝 옵션';
    for(const [k,v] of tune) h += `<div>· ${k} <b>${v}</b></div>`;
    h += '</div>';
  }
  h += '</div>';
  $('verdict').innerHTML = h;
  $('scenarioCard').classList.add('hide');
  $('checkCard').classList.add('hide');
}

function slotPrice(entry, slot, ktr, side){
  return entry + (side==='LONG'?-1:1)*(slot-1)*ktr;
}
function pnlAt(slots, lot, target, entry, ktr, side, pt){
  const sign = side==='LONG'?1:-1;
  let p=0;
  for(const s of slots) p += (target - slotPrice(entry,s,ktr,side))*sign*lot*pt;
  return p;
}

function renderOk(i, side, slPt, kCount, lot, loss){
  const p = [1,3,5].map(s=>slotPrice(i.entry,s,i.ktr,side));
  $('verdict').innerHTML =
    `<div class="verdict ok"><div class="big">✅ 진입가능 <span style="color:var(--muted);font-weight:400;font-size:13px">· ${side} · ${kCount.toFixed(1)}K</span></div>`+
    `<div class="lots">1차 ${p[0].toFixed(i.dp)} / 3차 ${p[1].toFixed(i.dp)} / 5차 ${p[2].toFixed(i.dp)} &nbsp;<b style="color:var(--gold)">각 ${lot.toFixed(2)}랏</b> · Loss <b>$${Math.round(loss)}</b></div></div>`;

  // 시나리오 표
  const bePrice=i.entry, k1Price=i.entry+(side==='LONG'?1:-1)*i.ktr, slP=i.sl;
  const cols=[[1],[1,3],[1,3,5]];
  const rows=[
    ['본절', bePrice], ['+1K', k1Price], ['SL', slP],
  ];
  let t = '<thead><tr><th>도달</th>'+cols.map(c=>`<th>${c.join('+')}<span class="price-lbl">${(c.length*lot).toFixed(2)}랏</span></th>`).join('')+'</tr></thead><tbody>';
  for(const [name,price] of rows){
    t += `<tr><td>${name}<span class="price-lbl">${price.toFixed(i.dp)}</span></td>`;
    for(const c of cols){
      const v=pnlAt(c,lot,price,i.entry,i.ktr,side,i.pt);
      t += `<td class="${cls(v)}">${fmtUsd(v)}</td>`;
    }
    t += '</tr>';
  }
  t += '</tbody>';
  $('scenarioTable').innerHTML = t;
  $('scenarioCard').classList.remove('hide');

  // 체크 카드
  const slots=[1,3,5];
  $('checks').innerHTML = slots.map((s,idx)=>
    `<div class="chk ${checked[idx]?'on':''}" data-i="${idx}"><div class="box">✓</div>`+
    `<div class="n">${s}차</div><div class="p">${p[idx].toFixed(i.dp)}</div><div class="l">${lot.toFixed(2)}랏</div></div>`
  ).join('');
  $('checks').querySelectorAll('.chk').forEach(el=>{
    el.onclick=()=>{ const k=+el.dataset.i; checked[k]=!checked[k]; save(); renderStatus(i,side,lot); calc(); };
  });
  renderStatus(i, side, lot);
  $('checkCard').classList.remove('hide');
}

function renderStatus(i, side, lot){
  const active=[1,3,5].filter((s,idx)=>checked[idx]);
  const totLot=active.length*lot;
  const bePrice=i.entry, k1Price=i.entry+(side==='LONG'?1:-1)*i.ktr, slP=i.sl;
  const mk=(k,price)=>{
    if(!active.length) return `<div class="stat"><div class="k">${k}</div><div class="v zero">—</div></div>`;
    const v=pnlAt(active,lot,price,i.entry,i.ktr,side,i.pt);
    return `<div class="stat"><div class="k">${k} · ${price.toFixed(i.dp)}</div><div class="v ${cls(v)}">${fmtUsd(v)}</div></div>`;
  };
  $('status').innerHTML =
    `<div class="stat" style="flex:0 0 auto"><div class="k">체결</div><div class="v" style="color:var(--gold)">${totLot.toFixed(2)}랏</div></div>`+
    mk('본절',bePrice)+mk('+1K',k1Price)+mk('SL',slP);
}

// ── 현재가 ──
async function fetchPrice(){
  const sym=$('symbol').value, live=SYMBOLS[sym].live;
  if(!live){ $('priceNote').textContent='이 종목은 현재가 미지원 (수동 입력)'; return; }
  $('priceNote').textContent='불러오는 중…';
  try{
    const r=await fetch(`https://api.gold-api.com/price/${live}`,{cache:'no-store'});
    const d=await r.json();
    const dp=SYMBOLS[sym].dp, price=+d.price;
    $('entry').value = price.toFixed(dp);
    $('sl').value = (price - 100).toFixed(dp);   // 손절 기본 -100pt (LONG 가정)
    $('priceNote').innerHTML = `현재가 <b style="color:var(--gold)">${price.toFixed(dp)}</b> · ${d.updatedAtReadable||'now'} · SL 자동 ${(price-100).toFixed(dp)}`;
    save(); calc();
  }catch(e){
    $('priceNote').textContent='불러오기 실패 (오프라인?) — 수동 입력하세요';
  }
}

// ── 저장 ──
function save(){
  const s={};
  ['symbol','entry','sl','ktr'].forEach(k=>s[k]=$(k).value);
  s.margin=margin; s.pct=pct; s.checked=checked;
  localStorage.setItem('ktr_risk', JSON.stringify(s));
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem('ktr_risk')||'{}');
    ['symbol','entry','sl','ktr'].forEach(k=>{ if(s[k]!=null&&s[k]!=='') $(k).value=s[k]; });
    if(Number.isFinite(s.margin)) margin=s.margin;
    if(Number.isFinite(s.pct)) pct=s.pct;
    if(Array.isArray(s.checked)) checked=s.checked;
  }catch(e){}
  if(!$('ktr').value) $('ktr').value = 10;   // KTR 기본값
  renderRisk();
}

['symbol','entry','sl','ktr'].forEach(k=>{
  $(k).addEventListener('input',()=>{ save(); calc(); });
});
// 포커스 시 기존값 비우고 바로 숫자 입력 (안 고치고 빠져나가면 복원)
['entry','sl','ktr'].forEach(k=>{
  const el=$(k);
  el.addEventListener('focus',()=>{ el.dataset.prev=el.value; el.value=''; });
  el.addEventListener('blur',()=>{ if(el.value===''&&el.dataset.prev){ el.value=el.dataset.prev; save(); calc(); } });
});
// 스텝퍼 (증거금 ±100 / 리스크% ±10, 10~50)
document.querySelectorAll('.stepper button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const d=+btn.dataset.d;
    if(btn.dataset.k==='margin') margin=Math.max(100, margin + d*100);
    else pct=Math.min(50, Math.max(10, pct + d*10));
    renderRisk(); save(); calc();
  });
});
$('symbol').addEventListener('change',()=>{ $('priceNote').textContent=''; });
$('fetchBtn').addEventListener('click', fetchPrice);

load(); calc();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
